<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Учёт учебной нагрузки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 32rem;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Вход в систему</h1>
                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">Неверное имя пользователя или пароль.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label class="form-label" for="id_username">Имя пользователя</label>
                        <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_password">Пароль</label>
                        <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Войти</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
