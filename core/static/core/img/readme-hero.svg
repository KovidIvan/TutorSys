<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#07132c"/>
      <stop offset="100%" stop-color="#050b1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0f2347" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0a1936" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="wave2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#09152e" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow)"/>

  <path d="M-40,260 C240,90 540,70 820,210 C980,290 1120,240 1240,150 L1240,340 L-40,340 Z" fill="url(#wave1)"/>
  <path d="M180,-20 C460,140 760,150 1060,20 L1240,110 L1240,340 L180,340 Z" fill="url(#wave2)"/>

  <!-- Стеклянная центральная карточка -->
  <rect x="190" y="42" width="820" height="236" rx="24" fill="url(#glass)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Эмблема S.C.A.L.E в левой части карточки (в стиле 3D-лого с колонной и двухъярусным постаментом) -->
  <g transform="translate(242, 92)">
    <rect x="0" y="0" width="136" height="136" rx="30" fill="#07132c" fill-opacity="0.76" stroke="url(#borderGrad)" stroke-width="1.5"/>
    <!-- Опорная колонна -->
    <rect x="63.5" y="54" width="4.5" height="44" fill="#2563eb" fill-opacity="0.88"/>
    <rect x="68" y="54" width="4.5" height="44" fill="#1e3a8a" fill-opacity="0.95"/>
    <rect x="63.5" y="54" width="9" height="44" fill="none" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="0.9"/>
    <!-- Тулья шапочки -->
    <path d="M51,44 L51,60 L68,67 L85,60 L85,44 Z" fill="#1d4ed8" fill-opacity="0.85" stroke="url(#titleGrad)" stroke-width="1.2"/>
    <!-- Кисточка: шнур выходит из-под правого края ромба вниз к подвеске -->
    <line x1="95" y1="40.2" x2="95" y2="52" stroke="#e2e8f0" stroke-width="2" stroke-linecap="butt"/>
    <circle cx="95" cy="51.8" r="1.5" fill="#ffffff"/>
    <polygon points="93,52.3 97,52.3 98.5,58.8 91.5,58.8" fill="url(#titleGrad)"/>
    <!-- Верхний ромб конфедератки -->
    <polygon points="68,22 33,36 68,51" fill="#3b82f6" fill-opacity="0.9"/>
    <polygon points="68,22 103,36 68,51" fill="#1e3a8a" fill-opacity="0.95"/>
    <polygon points="68,22 103,36 68,51 33,36" fill="none" stroke="url(#titleGrad)" stroke-width="1.5"/>
    <!-- Фигурное серебристое коромысло -->
    <path d="M38,60 L55,60 C62,60 66,63 68,69 C70,63 74,60 81,60 L98,60"
          fill="none" stroke="url(#titleGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="60" r="3" fill="#ffffff"/>
    <circle cx="98" cy="60" r="3" fill="#ffffff"/>
    <!-- Левая чаша со стропами -->
    <line x1="37" y1="62" x2="27" y2="82" stroke="url(#titleGrad)" stroke-width="1.6"/>
    <line x1="39" y1="62" x2="49" y2="82" stroke="url(#titleGrad)" stroke-width="1.6"/>
    <path d="M24,82 C24,93 52,93 52,82 Z" fill="#2563eb" stroke="#93c5fd" stroke-width="1.2"/>
    <rect x="23" y="80.5" width="30" height="2.4" rx="1.2" fill="url(#titleGrad)"/>
    <!-- Правая чаша со стропами -->
    <line x1="97" y1="62" x2="87" y2="82" stroke="url(#titleGrad)" stroke-width="1.6"/>
    <line x1="99" y1="62" x2="109" y2="82" stroke="url(#titleGrad)" stroke-width="1.6"/>
    <path d="M84,82 C84,93 112,93 112,82 Z" fill="#2563eb" stroke="#93c5fd" stroke-width="1.2"/>
    <rect x="83" y="80.5" width="30" height="2.4" rx="1.2" fill="url(#titleGrad)"/>
    <!-- Двухъярусный постамент -->
    <path d="M54,97 L82,97 C84,97 86,99 86.5,102 L49.5,102 C50,99 52,97 54,97 Z" fill="url(#titleGrad)"/>
    <path d="M48,102 L88,102 C90,102 92,104 92.5,107.5 L43.5,107.5 C44,104 46,102 48,102 Z" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.1"/>
  </g>

  <text x="665" y="138" text-anchor="middle" fill="url(#titleGrad)"
        font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="bold" letter-spacing="14">
    S.C.A.L.E
  </text>

  <text x="665" y="176" text-anchor="middle" fill="#bfdbfe" opacity="0.88"
        font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" letter-spacing="4.6">
    STAFF CURRICULUM &amp; ALLOCATION LEDGER ENGINE
  </text>

  <line x1="565" y1="198" x2="765" y2="198" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.2"/>

  <text x="665" y="228" text-anchor="middle" fill="#e2e8f0" opacity="0.8"
        font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="14.5" letter-spacing="0.7">
    Система расчёта, распределения и контроля выполнения учебной нагрузки
  </text>
</svg>
