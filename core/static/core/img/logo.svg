<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Глубокий тёмно-синий фон (Windows 11 Dark Blue) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="50%" stop-color="#0a1936"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Центральное сапфировое свечение -->
    <radialGradient id="ambientGlow" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.58"/>
      <stop offset="55%" stop-color="#0f2347" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Геометрические волны-складки (Bloom) -->
    <linearGradient id="bloom1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a1c3e" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="bloom2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Стеклянная карточка внутри -->
    <linearGradient id="glassCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="#071229" stop-opacity="0.68"/>
    </linearGradient>

    <!-- Световой контур стекла -->
    <linearGradient id="glassBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Градиент серебристо-белого металла/стекла -->
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Градиент кобальтового стекла (левая грань и колонна) -->
    <linearGradient id="cobaltGlassLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Градиент тёмно-сапфирового стекла (правая грань) -->
    <linearGradient id="cobaltGlassRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f2347" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Градиент стеклянных чаш весов -->
    <linearGradient id="bowlGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020611" flood-opacity="0.6"/>
    </filter>

    <clipPath id="squircleClip">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
  </defs>

  <!-- Внешний корпус иконки -->
  <g clip-path="url(#squircleClip)">
    <rect x="8" y="8" width="240" height="240" fill="url(#bgGrad)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#ambientGlow)"/>

    <!-- Многослойные волны Bloom на фоне -->
    <path d="M-20,190 C55,110 135,100 205,165 C235,190 255,175 275,145 L275,265 L-20,265 Z" fill="url(#bloom1)"/>
    <path d="M35,-15 C105,65 175,75 245,10 L275,55 L275,265 L35,265 Z" fill="url(#bloom2)"/>
  </g>

  <!-- Внешняя неоново-ледяная рамка -->
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="url(#glassBorder)" stroke-width="1.8"/>

  <!-- Внутренний стеклянный медальон -->
  <rect x="24" y="24" width="208" height="208" rx="44" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.4"/>

  <!-- Центральная композиция S.C.A.L.E (в точном соответствии с 3D-эмблемой) -->
  <g filter="url(#dropShadow)">

    <!-- 1. ЦЕНТРАЛЬНАЯ ОПОРНАЯ КОЛОННА (от основания шапочки до постамента) -->
    <rect x="120" y="102" width="8" height="78" fill="url(#cobaltGlassLeft)"/>
    <rect x="128" y="102" width="8" height="78" fill="url(#cobaltGlassRight)"/>
    <rect x="120" y="102" width="16" height="78" fill="none" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="128" y1="104" x2="128" y2="178" stroke="#93c5fd" stroke-opacity="0.45" stroke-width="1.2"/>

    <!-- 2. ТУЛЬЯ (ОСНОВАНИЕ) АКАДЕМИЧЕСКОЙ КОНФЕДЕРАТКИ (соединённая с коромыслом) -->
    <path d="M98,84 L98,113 L128,125 L128,96 Z" fill="url(#cobaltGlassLeft)"/>
    <path d="M128,96 L128,125 L158,113 L158,84 Z" fill="url(#cobaltGlassRight)"/>
    <!-- Боковые серебристые стойки тульи -->
    <rect x="96" y="84" width="4.5" height="29" rx="1.5" fill="url(#silverGrad)"/>
    <rect x="155.5" y="84" width="4.5" height="29" rx="1.5" fill="url(#silverGrad)"/>

    <!-- 3. ВЕРХНИЙ РОМБ КОНФЕДЕРАТКИ (двухгранное сапфировое стекло с серебристым кантом) -->
    <!-- Кисточка конфедератки: шнур выходит из-под нижнего правого канта ромба, не выступая над гранью -->
    <line x1="176" y1="79" x2="176" y2="93.5" stroke="#e2e8f0" stroke-width="3" stroke-linecap="butt"/>
    <circle cx="176" cy="93" r="2.5" fill="#ffffff"/>
    <polygon points="173,94 179,94 181.5,104 170.5,104" fill="url(#silverGrad)" stroke="#ffffff" stroke-width="0.6"/>

    <!-- Нижний серебристый кант ромба (объёмная толщина) -->
    <polygon points="128,95 190,69 190,74 128,101 66,74 66,69" fill="url(#silverGrad)"/>
    <!-- Левая светло-сапфировая грань -->
    <polygon points="128,44 66,69 128,95" fill="url(#cobaltGlassLeft)"/>
    <!-- Правая глубокая сапфировая грань -->
    <polygon points="128,44 190,69 128,95" fill="url(#cobaltGlassRight)"/>
    <!-- Контур и центральное ребро жёсткости -->
    <polygon points="128,44 190,69 128,95 66,69" fill="none" stroke="#93c5fd" stroke-width="1.6"/>
    <line x1="128" y1="44" x2="128" y2="95" stroke="#93c5fd" stroke-opacity="0.55" stroke-width="1.2"/>

    <!-- 4. ФИГУРНОЕ СЕРЕБРИСТОЕ КОРОМЫСЛО ВЕСОВ (с центральным V-сводом на колонне) -->
    <path d="M74,113 L104,113 C117,113 124,118 128,125 C132,118 139,113 152,113 L182,113
             L182,120 L152,120 C140,120 133,125 128,137 C123,125 116,120 104,120 L74,120 Z"
          fill="url(#silverGrad)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.8"/>

    <!-- Шарниры подвеса на концах коромысла -->
    <circle cx="74" cy="116.5" r="5.5" fill="url(#silverGrad)" stroke="#ffffff" stroke-width="1"/>
    <circle cx="182" cy="116.5" r="5.5" fill="url(#silverGrad)" stroke="#ffffff" stroke-width="1"/>

    <!-- 5. ЛЕВАЯ ЧАША ВЕСОВ (подвешена к левому шарниру коромысла) -->
    <line x1="72" y1="121" x2="54" y2="156" stroke="url(#silverGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="76" y1="121" x2="94" y2="156" stroke="url(#silverGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M49,156 C49,175 99,175 99,156 Z" fill="url(#bowlGlass)" stroke="#93c5fd" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="47.5" y="153.5" width="53" height="4" rx="2" fill="url(#silverGrad)"/>

    <!-- 6. ПРАВАЯ ЧАША ВЕСОВ (подвешена к правому шарниру коромысла) -->
    <line x1="180" y1="121" x2="162" y2="156" stroke="url(#silverGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="184" y1="121" x2="202" y2="156" stroke="url(#silverGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M157,156 C157,175 207,175 207,156 Z" fill="url(#bowlGlass)" stroke="#93c5fd" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="155.5" y="153.5" width="53" height="4" rx="2" fill="url(#silverGrad)"/>

    <!-- 7. ДВУХЪЯРУСНЫЙ ПОСТАМЕНТ (монолитная база весов как на 3D-логотипе) -->
    <!-- Верхняя серебристая ступень постамента -->
    <path d="M104,178 L152,178 C156,178 159,181 160,186 L96,186 C97,181 100,178 104,178 Z"
          fill="url(#silverGrad)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="0.8"/>
    <!-- Нижняя широкая сапфировая плита постамента -->
    <path d="M93,186 L163,186 C167,186 170,189 171,194 L85,194 C86,189 89,186 93,186 Z"
          fill="url(#cobaltGlassLeft)" stroke="#60a5fa" stroke-width="1.4"/>
    <line x1="87" y1="194" x2="169" y2="194" stroke="#93c5fd" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
