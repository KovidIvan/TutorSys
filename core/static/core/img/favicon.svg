<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07132c"/>
      <stop offset="50%" stop-color="#0f2347"/>
      <stop offset="100%" stop-color="#050b1a"/>
    </linearGradient>
    <linearGradient id="fBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="fSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="fCobaltL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="fCobaltR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2347"/>
    </linearGradient>
  </defs>

  <!-- Корпус иконки -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#fBg)" stroke="url(#fBorder)" stroke-width="1.6"/>

  <!-- Опорная колонна весов -->
  <rect x="29.5" y="25" width="2.5" height="22" fill="url(#fCobaltL)"/>
  <rect x="32" y="25" width="2.5" height="22" fill="url(#fCobaltR)"/>
  <rect x="29.5" y="25" width="5" height="22" fill="none" stroke="#60a5fa" stroke-width="0.6"/>

  <!-- Тулья конфедератки -->
  <polygon points="24,21 24,28.5 32,31.5 40,28.5 40,21" fill="url(#fCobaltL)" stroke="url(#fSilver)" stroke-width="1"/>

  <!-- Кисточка: шнур выходит из-под правого края ромба вниз к подвеске -->
  <line x1="45" y1="19.3" x2="45" y2="24" stroke="#ffffff" stroke-width="1.5" stroke-linecap="butt"/>
  <polygon points="43.5,23.8 46.5,23.8 47.3,27.2 42.7,27.2" fill="#ffffff"/>

  <!-- Верхний ромб конфедератки -->
  <polygon points="32,10 15,17 32,24" fill="url(#fCobaltL)"/>
  <polygon points="32,10 49,17 32,24" fill="url(#fCobaltR)"/>
  <polygon points="32,10 49,17 32,24 15,17" fill="none" stroke="url(#fSilver)" stroke-width="1.2"/>

  <!-- Изогнутое серебристое коромысло -->
  <path d="M17,28.5 L26,28.5 C29.5,28.5 31,30 32,33 C33,30 34.5,28.5 38,28.5 L47,28.5"
        fill="none" stroke="url(#fSilver)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="17" cy="28.5" r="1.8" fill="#ffffff"/>
  <circle cx="47" cy="28.5" r="1.8" fill="#ffffff"/>

  <!-- Левая чаша со стропами -->
  <line x1="16.5" y1="29.5" x2="11.5" y2="39" stroke="url(#fSilver)" stroke-width="1.2"/>
  <line x1="17.5" y1="29.5" x2="22.5" y2="39" stroke="url(#fSilver)" stroke-width="1.2"/>
  <path d="M10,39 C10,44.5 24,44.5 24,39 Z" fill="#3b82f6" stroke="url(#fSilver)" stroke-width="1"/>

  <!-- Правая чаша со стропами -->
  <line x1="46.5" y1="29.5" x2="41.5" y2="39" stroke="url(#fSilver)" stroke-width="1.2"/>
  <line x1="47.5" y1="29.5" x2="52.5" y2="39" stroke="url(#fSilver)" stroke-width="1.2"/>
  <path d="M40,39 C40,44.5 54,44.5 54,39 Z" fill="#3b82f6" stroke="url(#fSilver)" stroke-width="1"/>

  <!-- Двухъярусный постамент -->
  <path d="M25,46.5 L39,46.5 L40.5,49.5 L23.5,49.5 Z" fill="url(#fSilver)"/>
  <path d="M21.5,49.5 L42.5,49.5 L44,52.5 L20,52.5 Z" fill="url(#fCobaltL)" stroke="#60a5fa" stroke-width="0.9"/>
</svg>
